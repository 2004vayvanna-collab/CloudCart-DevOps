
services:
  postgres:
    image: postgres:17
    container_name: cloudcart-postgres
    environment:
      POSTGRES_DB: cloudcart_products
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} POSTGRES_PASSWORD: cloudcart_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart -d cloudcart_products"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: ./services/product-service
    image: cloudcart-product-service:1.0
    container_name: cloudcart-product-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/cloudcart_products
      DB_USER: cloudcart
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
