
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-product-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cloudcart-product
    release: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
