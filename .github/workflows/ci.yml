
name: CloudCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cloudcart_products
          POSTGRES_USER: cloudcart
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloudcart -d cloudcart_products"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5433/cloudcart_products
          DB_USER: cloudcart
          DB_PASSWORD: ci_test_password
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build -t cloudcart-product-service:ci .
