
name: CloudCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cloudcart_products
          POSTGRES_USER: cloudcart
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloudcart -d cloudcart_products"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5433/cloudcart_products
          DB_USER: cloudcart
          DB_PASSWORD: ci_test_password
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build --pull --no-cache -t cloudcart-product-service:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudcart-product-service:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./services/product-service
          pull: true
          push: true
          tags: |
            ghcr.io/2004vayvanna-collab/cloudcart-product-service:latest
            ghcr.io/2004vayvanna-collab/cloudcart-product-service:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/2004vayvanna-collab/CloudCart-DevOps
